# ===========================================================================
#  Strict security headers - single-page application and static assets
# ===========================================================================
#  This file is `include`d rather than written inline because of an nginx rule
#  that catches people out: `add_header` is **not** inherited into a `location`
#  block that declares any `add_header` of its own. A single `add_header
#  Cache-Control ...` inside a location silently drops every security header
#  set at server level. Keeping the full set in one snippet and including it
#  everywhere avoids that trap entirely.
# ===========================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

# ---------------------------------------------------------------------------
# Content-Security-Policy for the Angular application.
#
#  default-src 'self'   nothing may be loaded from a third-party origin
#  script-src  'self'   no inline scripts, no eval - the production build emits
#                       external files only, so this can stay strict
#  style-src   'self' 'unsafe-inline'
#                       Angular injects component styles as <style> elements.
#                       'unsafe-inline' is scoped to styles, which cannot
#                       execute code, so the XSS surface stays closed.
#  connect-src 'self'   the API is same-origin, proxied below: no CORS, and a
#                       compromised script cannot exfiltrate to another host
#  object-src  'none'   no plugins
#  frame-ancestors 'none'
#                       the application can never be framed (clickjacking)
#
#  `upgrade-insecure-requests` is deliberately absent: the demo is served over
#  plain HTTP on localhost, and that directive would rewrite every subresource
#  request to https://, where nothing is listening. Add it when serving over
#  TLS.
# ---------------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# HSTS is only honoured over HTTPS, so it is commented out for the HTTP demo.
# Uncomment when the application is served over TLS.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
