# ===========================================================================
#  Shared proxy settings for every location that forwards to the API
# ===========================================================================

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# $http_host, not $host: nginx's $host drops the port, and the API reconstructs
# the origin the browser addressed in order to recognise same-origin requests
# (a browser sends Origin on every POST, including same-origin ones). Without
# the port that reconstruction yields "http://localhost" while the browser said
# "http://localhost:8080", the two never match, and every login and transfer is
# refused as a cross-origin request. $http_host forwards the Host header the
# client actually sent, port included.
proxy_set_header X-Forwarded-Host  $http_host;

# The client's Authorization header is forwarded - that is how the API
# authenticates the request - but the cookie header is dropped. The API never
# authenticates from a cookie, so forwarding it would only give a browser-
# attached credential a path into the backend that it should not have.
proxy_set_header Cookie "";

# Do not reuse a keep-alive connection to a backend that may have restarted.
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Let the API's own JSON error bodies through unchanged, and never let a proxy
# error page replace them.
proxy_intercept_errors off;
