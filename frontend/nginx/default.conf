# ===========================================================================
#  DemoBank - nginx site configuration
# ===========================================================================
#  Serves the compiled Angular application and reverse-proxies the API, so the
#  browser talks to a single origin. That removes CORS from the picture
#  entirely and lets the Content-Security-Policy stay at `connect-src 'self'`.
#
#  Runs in the `nginx-unprivileged` image: the process is not root and listens
#  on 8080, because binding to port 80 is a privileged operation.
#
#  This file is included from the image's `http {}` block, which is why the
#  `limit_req_zone` directive below - an http-level directive - is valid here.
# ===========================================================================

# ---------------------------------------------------------------------------
#  Login rate limiting, at the edge.
#
#  The API has its own per-account throttle; this one is per source address and
#  stops the flood one layer earlier, before a request ever reaches the JVM.
#  Two independent limiters is not redundancy for its own sake: they defend
#  against different attacks. This one blunts a single noisy source; the API's
#  one still protects an account when the attack is spread across many
#  addresses.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

# Hide the nginx version from error pages and the Server header.
server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Request body ceiling: the API only accepts small JSON documents, so
    # anything large is rejected here rather than buffered in memory.
    client_max_body_size 256k;

    # Advertise nothing about the technology stack.
    etag off;

    # -----------------------------------------------------------------------
    # Liveness probe for the Docker healthcheck. No access log: it would fill
    # the log with noise and tell an attacker nothing they cannot guess.
    # -----------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # Authentication endpoint: throttled, then forwarded.
    # -----------------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        include /etc/nginx/snippets/api-headers.conf;
        include /etc/nginx/snippets/proxy.conf;

        proxy_pass http://backend:8080;
    }

    # -----------------------------------------------------------------------
    # Everything else under the API.
    # -----------------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/api-headers.conf;
        include /etc/nginx/snippets/proxy.conf;

        proxy_pass http://backend:8080;
    }

    # -----------------------------------------------------------------------
    # API documentation (`demo` profile only). Proxied so that the backend
    # never needs a published port of its own.
    #
    # `^~` is load-bearing. nginx evaluates regex locations BEFORE prefix
    # locations, so the asset rule further down this file (`\.js|\.css|...$`)
    # would win for /swagger-ui/swagger-ui-bundle.js and the rest, and nginx
    # would look for those files on its own disk - where they do not exist,
    # because they live inside the backend jar. The result is a documentation
    # page whose HTML loads and whose scripts and styles all return 404: a
    # blank screen. `^~` says "if this prefix matches, stop here and do not
    # consider the regex rules", which is exactly the intent.
    # -----------------------------------------------------------------------
    location ^~ /swagger-ui/ {
        include /etc/nginx/snippets/api-headers.conf;
        include /etc/nginx/snippets/proxy.conf;

        proxy_pass http://backend:8080;
    }

    location /swagger-ui.html {
        include /etc/nginx/snippets/api-headers.conf;
        include /etc/nginx/snippets/proxy.conf;

        proxy_pass http://backend:8080;
    }

    location ^~ /v3/api-docs {
        include /etc/nginx/snippets/api-headers.conf;
        include /etc/nginx/snippets/proxy.conf;

        proxy_pass http://backend:8080;
    }

    # -----------------------------------------------------------------------
    # Hashed build artefacts. The filename changes whenever the content does
    # (`outputHashing: all`), so they can be cached forever.
    # -----------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|svg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;

        expires 1y;
        add_header Cache-Control "public, immutable";

        access_log off;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # The application shell. `index.html` must never be cached, otherwise a
    # browser keeps loading an old page that references build artefacts which
    # no longer exist.
    # -----------------------------------------------------------------------
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;

        add_header Cache-Control "no-store, must-revalidate";

        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Client-side routing: any unknown path is the Angular router's business.
    # -----------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/security-headers.conf;

        try_files $uri $uri/ /index.html;
    }
}
