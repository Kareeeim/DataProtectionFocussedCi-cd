# ===========================================================================
#  Headers nginx adds to responses it proxies to the API
# ===========================================================================
#  Deliberately almost empty, and that is the point.
#
#  The API sets its own security headers on every response through its Spring
#  Security filter chain - CSP, X-Content-Type-Options, X-Frame-Options,
#  Referrer-Policy, Permissions-Policy, COOP, CORP and Cache-Control. Adding a
#  second copy here does not reinforce them: it produces responses carrying the
#  header twice, and for Content-Security-Policy that is actively harmful.
#  A browser enforces *every* CSP it receives, so two policies combine into
#  their intersection - and the resulting policy is neither of the two written
#  in the configuration files. The API's own policy also depends on the active
#  profile (the `demo` profile relaxes it just enough for Swagger UI, `prod`
#  keeps `default-src 'none'`), which is knowledge nginx simply does not have.
#
#  So the rule is: one authoritative policy per response. The API owns the
#  headers of everything it generates; nginx owns the headers of the SPA and
#  the static assets it serves itself (see security-headers.conf).
#
#  X-Robots-Tag is the exception, and the reason this file exists: the API does
#  not set it, and an API response should never end up in a search index.
# ===========================================================================

add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
